[project]
name = "printpi-daemon"
version = "0.1.0"
description = "PrintPi printer daemon: owns the serial port and speaks Marlin G-code"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "redis>=5",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
printpi-daemon = "printpi_daemon.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["printpi_daemon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
