# deploy/nginx/printpi.conf for the container: the entry point fills in the port.
server {
    listen __PORT__ default_server;
    listen [::]:__PORT__ default_server;
    server_name _;
    root /opt/printpi/app/public;
    index index.php;
    charset utf-8;
    client_max_body_size 512M;
    access_log off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Debian's fastcgi_params passes $host, which drops the port; behind a port mapping the
        # app needs the port the browser used to build absolute asset URLs.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_hide_header X-Powered-By;
    }

    # MJPEG stream from ustreamer, started by the daemon.
    location /webcam/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
